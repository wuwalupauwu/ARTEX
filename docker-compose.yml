services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-theresa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-theresa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-theresa} -d ${POSTGRES_DB:-theresa}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  theresa:
    image: wuwalupauwu/theresa:${THERESA_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      THERESA_PG_DSN: postgres://${POSTGRES_USER:-theresa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-theresa}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      THERESA_LLM_PROVIDER: ${THERESA_LLM_PROVIDER:-}
      THERESA_LLM_MODEL: ${THERESA_LLM_MODEL:-}
      THERESA_LLM_BASE_URL: ${THERESA_LLM_BASE_URL:-}
      THERESA_LLM_PROXY: ${THERESA_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
